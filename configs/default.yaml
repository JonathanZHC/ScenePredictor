ros:
  world_frame: world
  camera_names: [camera_0] # [camera_0, camera_1]
  color_topic: "/{camera}/color/image_raw" # "/{camera}/color/image_raw/compressed"
  depth_topic: "/{camera}/depth/image_raw" # "/{camera}/depth/image_raw/compressedDepth"
  camera_info_topic: "/{camera}/color/camera_info" # "/{camera}/camera_info"
  camera_frame: "{camera}_color_optical_frame"
  queue_depth: 4
  # Orbbec RGB/depth stamps differ by ~0.15-0.20 ms in the current D2C stream.
  # Pair each camera locally using RGB as the canonical view timestamp.
  sync_slop_seconds: 0.001
  # Only used when camera_names contains multiple cameras.
  multiview_sync_slop_seconds: 0.01
  tf_timeout_ms: 10.0

# SAM3 / EfficientTAM / multiview tracking remain owned by the tracker config.
tracker:
  config_path: /workspace/configs/tracking.yaml
  checkpoint_root: /workspace/checkpoints

# DifFlow is an always-on stage. Only ScenePredictor integration settings live
# here; model/preprocessing/recovery hyperparameters live in difflow.yaml.
flow:
  # Use the prebuilt ABI-matched copy produced by the Docker image. The source
  # submodule under /workspace/DifFlow3D is copied here during image build.
  repo_path: /opt/DifFlow3D
  config_path: /workspace/configs/difflow.yaml
  max_frame_gap_s: 0.20

# ScenePredictor-specific semantic recovery policy. Numerical Gaussian recovery
# settings are loaded from difflow.yaml.
recovery:
  restrict_same_track: true

output:
  publish_tracked_objects: true
  publish_velocity_cloud: false
  publish_velocity_markers: true
  publish_tracked_masks: false
  publish_annotated_rgb: true
  publish_flow_anchors: true
  velocity_marker_stride: 16
  velocity_marker_scale: 0.30
  profile_interval_frames: 30

runtime:
  device: cuda
  enable_cuda_timing: true
  allow_tf32: true
