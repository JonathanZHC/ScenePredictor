ros:
  world_frame: world
  camera_names: [camera_0, camera_1]
  color_topic: "/{camera}/color/image_raw"
  depth_topic: "/{camera}/depth/image_raw"
  camera_info_topic: "/{camera}/camera_info"
  pose_topic: "/{camera}/pose"
  queue_depth: 4
  incomplete_timeout_ms: 50.0

models:
  yolo_weights: yolo26n-seg.pt
  yolo_image_size: 640
  yolo_confidence: 0.25
  yolo_iou: 0.70
  clip_model: ViT-B-32
  clip_pretrained: openai
  clip_crop_padding: 0.10
  clip_batch_size: 64

masks:
  object_erosion_pixels: 2
  background_dilation_pixels: 4

depth:
  min_m: 0.10
  max_m: 5.00

multiview:
  centroid_gate_m: 0.30
  reprojection_points: 64
  minimum_visible_points: 16
  occlusion_tolerance_m: 0.03
  depth_tolerance_m: 0.05
  reprojection_threshold: 0.50
  clip_threshold: 0.65
  high_class_confidence: 0.75
  reprojection_weight: 0.65
  clip_weight: 0.25
  centroid_weight: 0.10

voxel:
  size_m: 0.02
  origin_world: [0.0, 0.0, 0.0]

tracking:
  centroid_gate_m: 0.15
  clip_threshold: 0.60
  position_weight: 0.65
  appearance_weight: 0.35
  high_class_confidence: 0.75
  history_lags: [1, 2, 4, 8]
  centroid_speed_threshold_mps: 0.03
  voxel_iou_threshold: 0.60

flow:
  enabled: true
  repo_path: /opt/DifFlow3D
  model_module: model_difflow
  checkpoint: /opt/DifFlow3D/pretrain_weights/model_difflow_355_0.0114.pth
  target_points: 2048
  pre_fps_factor: 2.0
  iterations: 4
  uncertainty: 0.20
  cuda_graph_warmup: 10
  enable_tf32: true
  strict_checkpoint: false
  max_frame_gap_s: 0.20

recovery:
  knn: 3
  temperature_m: 0.02
  chunk_size: 8192
  restrict_same_track: true

output:
  publish_background: true
  publish_static_objects: true
  publish_moving_objects: true
  publish_velocity_cloud: true
  publish_velocity_markers: true
  publish_moving_masks: true
  publish_annotated_rgb: true
  velocity_marker_stride: 32
  velocity_marker_scale: 0.20
  profile_interval_frames: 30

runtime:
  device: cuda:0
  enable_cuda_timing: true
  allow_tf32: true
