ros:
  world_frame: world
  camera_names: [camera_0, camera_1]
  color_topic: "/{camera}/color/image_raw"
  depth_topic: "/{camera}/depth/image_raw"
  camera_info_topic: "/{camera}/camera_info"
  pose_topic: "/{camera}/pose"
  queue_depth: 4
  incomplete_timeout_ms: 50.0

models:
  # The TensorRT engine already contains the fixed YOLOE vocabulary. Re-export
  # it whenever object_labels.txt, image_size or engine_batch_size changes.
  backend: pytorch
  weights: /workspace/weights/yoloe-26x-seg.engine
  source_weights: /workspace/weights/yoloe-26x-seg.pt
  label_file: /workspace/configs/object_labels.txt
  image_size: 640
  engine_batch_size: 2
  confidence: 0.1
  iou: 0.70
  half: true
  retina_masks: true
  warmup_frames: 5

masks:
  object_erosion_pixels: 2
  background_dilation_pixels: 4

depth:
  min_m: 0.10
  max_m: 5.00

multiview:
  centroid_gate_m: 0.30
  aabb_gap_gate_m: 0.10
  reprojection_points: 96
  minimum_visible_points: 16
  occlusion_tolerance_m: 0.03
  depth_tolerance_m: 0.04
  reprojection_threshold: 0.30
  reprojection_weight: 0.85
  spatial_weight: 0.15

voxel:
  size_m: 0.02
  origin_world: [0.0, 0.0, 0.0]

tracking:
  # Current-observation geometry only; no predicted position or appearance.
  centroid_gate_m: 0.20
  aabb_gap_gate_m: 0.08
  voxel_neighbor_radius: 1
  voxel_coverage_threshold: 0.08
  voxel_weight: 0.70
  spatial_weight: 0.30

  history_lags: [1, 2, 4, 8, 16, 32]
  centroid_speed_threshold_mps: 0.03
  voxel_iou_threshold: 0.60
  minimum_history_matches: 1

flow:
  enabled: true
  repo_path: /opt/DifFlow3D
  model_module: model_difflow
  checkpoint: /opt/DifFlow3D/pretrain_weights/model_difflow_355_0.0114.pth
  target_points: 2048
  pre_fps_factor: 2.0
  iterations: 4
  uncertainty: 0.20
  cuda_graph_warmup: 10
  enable_tf32: true
  strict_checkpoint: false
  max_frame_gap_s: 0.20

recovery:
  knn: 3
  temperature_m: 0.02
  chunk_size: 8192
  restrict_same_track: true

output:
  publish_background: true
  publish_static_objects: true
  publish_moving_objects: true
  publish_velocity_cloud: true
  publish_velocity_markers: true
  publish_moving_masks: true
  publish_annotated_rgb: true
  velocity_marker_stride: 32
  velocity_marker_scale: 0.20
  profile_interval_frames: 30

runtime:
  device: cuda:0
  allow_tf32: true

  # Disable both for the lowest-latency deployment path.
  enable_profiling: true
  enable_cuda_timing: true
  profile_history_size: 300
  enable_visualization: true
