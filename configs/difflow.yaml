# DifFlow3D inference/deployment configuration used by ScenePredictor.
# ScenePredictor loads this file once at startup. The checkpoint path is resolved
# relative to flow.repo_path when it is not absolute.

runtime:
  device: cuda
  enable_tf32: true
  cuda_graph_warmup: 10
  validate_finite: false

model:
  checkpoint: checkpoints/model_difflow_355_0.0114.pth
  iterations:
    coarse: 4
    middle: 2
    fine: 2
  uncertainty: 0.10
  strict_checkpoint: true
  disable_bn_running_stats: true
  # Dense-input shortcuts for frames with at least this many anchors (0 = off).
  # Measured on the recorded human (6144-8192 anchors): -1.9 ms (hierarchical
  # cosine KNN) and -2.6 ms (strided level-1 selection) with unchanged accuracy.
  # Below 4096 anchors neither pays off, so they stay off for small objects.
  fast_top_level_min_points: 4096
  hier_cosine_min_points: 4096

preprocessing:
  # Exact anchor counts. fps_points is the maximum; a frame runs at the largest
  # bucket <= its candidate count (1 cm voxel points of the tracked objects), so
  # points are never duplicated unless there are fewer than 1024 (the network
  # minimum). A person at ~1.5 m is 5-7k voxel points -> 5120/6144 anchors;
  # error floor on static points 1.5 mm vs 5 mm at 1024 anchors. Voxel-2 only
  # engages above second_candidate_ratio * fps_points points (several people).
  fps_points: 8192
  point_buckets: [1024, 2048, 3072, 4096, 5120, 6144, 7168, 8192]
  second_candidate_ratio: 1.1
  final_selection: uniform
  # Z-order sort of the anchors (needed by model.fast_top_level_min_points).
  sort_anchors_morton: true

  # Runs after FPS
  auto_spatial_scale:
    enable: true
    target_model_volume: 5.0
    fixed_spatial_scale: 1.0

# Per-object inference (scene_pred_pipeline/object_flow.py), the default: every tracked object gets a DifFlow3D
# forward of its own - all its points plus, as context, the other objects' points in the grid cells (edge
# context_cell_m) it occupies or touches - each on its own CUDA stream; only its own anchors are used (dense
# recovery stays same-track). In one joint cloud the coarse pyramid levels are sampled by spatial extent: a thin or
# small object next to a large one keeps a handful of coarse points (a 0.6 m stick held by a person: 21 of 256,
# 6 of 64), its extremity gets a biased flow and a large uncertainty. SafetyFilterBench scene E (person striking
# with a stick, 3 x 60 s, uncertainty tightening on): joint cloud 3 items placed (the robot stalls), per object 12
# items and 9 of 27 strikes hit. Cost (RTX 5090): about 3.6 ms + 0.67 ms per 1000 points + 0.9 ms per further
# object, the forwards overlap; the context points are computed twice (person + stick: flow step 9.0 ms).
# Each further object costs about 15 s of start-up and 1.2 GiB of GPU memory (its own CUDA graphs).
# A single tracked instance is the plain joint forward. enabled: false = one joint cloud for all objects.
per_object:
  enabled: true
  max_objects: 4         # runners kept ready = min(max_objects, tracked instances); further objects ride with the largest
  context_cell_m: 0.15   # hyper-parameter: context = the other objects' points within about 1-2 cells of the object
  min_points: 256        # smaller objects ride in the largest object's cloud

recovery:
  softmax_sigma_m: 0.025  # Real/world metric bandwidth in metres.
  backend: local  # auto | global | local | torch
  local_radius_sigma: 4.0
  local_hash_size_factor: 4.0
  chunk_size: 4096  # Used only by the PyTorch fallback backend.
