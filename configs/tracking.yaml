runtime:
  target_hz: 30.0
  serialize_gpu: false
  use_bf16: true
  enable_visualization: false
  publish_debug_images: false

pointcloud:
  stride: 1
  # Sizes the per-record GPU geometry segments (two stable sorts + compaction run
  # over records x this). 4096 is ample for objects in the 960x600 ZED views (with
  # adaptive_geometry_sampling); DifFlow samples fps_points anchors from the union anyway.
  max_points_per_instance: 4096

# SAM3 is now a sparse asynchronous B=num_views detector. The initial SAM3 call
# is blocking only because no tracker state exists yet. Later refreshes never
# queue: if one SAM3 job is already in flight, another trigger is skipped.
detector:
  checkpoint: checkpoints/sam3.pt

  # detector.prompts is injected by ScenePredictor from scene_predictor.tracker
  # (tracked_prompts + excluded_prompts of default.yaml); a standalone
  # MultiViewRGBDTracker run defines them here.

  score_threshold: 0.3
  duplicate_iou_threshold: 0.7
  min_mask_pixels: 10

  refresh_seconds: 1.0
  trigger_on_anomaly: false
  min_frames_between_triggers: 5
  anomaly_presence_threshold: 0.05

tracker:
  offload_video_to_cpu: false
  offload_state_to_cpu: false
  vos_optimized: true
  gpu_preprocess: true
  pin_input_memory: true

  # Local slot lifecycle / SAM3 refresh continuity.
  release_after_missing_frames: 30
  local_slot_iou_threshold: 0.05

  efficient_tam:
    checkpoint: checkpoints/efficienttam_s_512x512.pt
    config: configs/efficienttam/efficienttam_s_512x512.yaml
    non_overlap_masks: false

    # sequential  -> batched B=num_views feature snapshot + per-object B=1 propagation
    # fixed_batch -> one B=num_views encoder + one fixed all-view/object batch
    execution_mode: fixed_batch

    # Slot count is derived directly from the capacities in detector.prompts.
    # torch.compile mode of the EfficientTAM components: true = "max-autotune",
    # false = "default" (shorter cold start).
    use_max_autotune: true
    feature_history_frames: 32
    prewarm_enabled: true
    prewarm_temporal_frames: 20
    prewarm_post_reset_frames: 2
    prewarm_passes: 2

postprocess:
  mask_threshold: 0.0
  tracking_erosion_pixels: 1
  exclusion_dilation_pixels: 1
  # CUDA depth-boundary flyer filter for tracked masks (A/B switch). Applied after the
  # residual fixed erosion above: a w-pixel 4-connected core is eroded, a per-instance
  # threshold T = median + k*1.4826*MAD of core depth differences is estimated, and the
  # boundary band is grown back only where |dD| < T. Set tracking_erosion_pixels to 0/1
  # when enabling so the filter (not the fixed erosion) decides the boundary.
  depth_boundary_filter:
    enabled: true
    erosion_width_px: 3
    mad_multiplier: 5.0
    min_threshold_m: 0.0   # floor for T (guards MAD = 0 on quantised depth); 0 = off
  min_component_pixels: 30
  min_valid_depth_m: 0.10
  max_valid_depth_m: 6.0

  # Frozen CUDA geometry path. Set false only for standalone CPU/debug fallback.
  gpu_geometry: true
  # Keep cross-view fusion + Chamfer staging on CUDA (no voxel-cloud D2H, NumPy
  # fusion, or re-upload). Requires gpu_geometry and enable_visualization: false;
  # cross-view *matching* still runs on CPU keys when >= 2 cameras. Set false to
  # reproduce the legacy host round trip.
  gpu_alignment: true

  # Eroded masks and prefetched depth feed the fused Warp
  # geometry backend directly. Compact voxel D2H and lazy CPU masks are
  # part of the frozen production implementation.

  # Choose a larger point-sampling stride for unusually large masks *before*
  # geometry coordinate extraction. The 2-D cleaned mask itself is unchanged.
  adaptive_geometry_sampling: true

  # The dense int32 owner map has no consumer in the current batched pipeline.
  # Disable it to avoid a full HxW allocation/zero-fill per camera per frame.
  build_owner_map: false

# Same time, different cameras: which instances are one object (sam_rgbd_tracking/cross_view_gap.py). Per semantic
# class the observations of every two cameras are matched one to one with the least total surface gap - the distance
# within which 5 % of one cloud's voxels find the other cloud. A gap below gap.merge_m merges on its own; a class
# left with more instances than its prompt capacity gets the nearest ones merged, up to gap.forced_max_m. Two views
# of one object merge although their boxes do not overlap (small objects seen from two sides, each camera seeing
# another part); an object seen by one camera only stays an instance of its own.
# MultiViewRGBDTracker scripts/benchmark_association.py: 20 scenes with known identities, 2 - 4 cameras.
shared_voxel_grid:
  voxel_size_m: 0.005
  origin_world: [0.0, 0.0, 0.0]
  gap:
    merge_m: 0.15        # two views of one object: 1 - 3 cm, up to 12 cm for cameras opposite each other
    split_m: 0.20        # a merged pair stays merged up to this gap
    forced_max_m: 0.50   # the count may force a merge up to this gap; beyond it the class stays over its capacity
    quantile: 0.05       # share of a cloud that has to lie within the gap of the other
    memory_s: 0.3        # a forced merge outlives the count by this (another object of the class hidden for a moment)
    samples: 96          # voxels per cloud a gap is measured on
    measure_every: 3     # frames between two measurements of a pair whose boxes keep their offset

# Different times: persistent global ids. A track is its last observed world box, no motion model. A track and an
# instance of its class can be matched when their boxes' containment reaches min_containment_ratio or one box holds
# the other's centre, expanded by a margin: centre_margin_m after one frame at 30 Hz, growing with the time since
# the track was seen (a speed limit of 4.5 m/s), so a lower frame rate or an object hidden for a moment does not
# cost the id. Among the possible matches: as many as possible with the least total distance between the box
# centres; of two tracks at the same distance the older one wins. Unmatched tracks keep their id for max_age_s.
cross_frame_alignment:
  min_containment_ratio: 0.5   # intersection volume / smaller box volume
  centre_margin_m: 0.15
  max_age_s: 0.5               # keep an unobserved id for this long
  # The fused clouds of the current and the previous frame live in a CUDA bank that the scene-flow stage reads;
  # rows of this many points are allocated at start (the bank grows when a cloud is larger).
  bank_preallocate_points: 16384

profiling:
  enabled: true
  # Execute these first live bundles normally, but exclude them from all timing
  # statistics/CSV so CUDA, BLAS, Chamfer workspace and allocator lazy-init do
  # not contaminate mean/median/p95/max. Set 0 to disable.
  warmup_frames: 30
  summary_interval_frames: 100
  cuda_events: true
  csv_path: logs/timing.csv
  # Buffer profiler CSV rows to avoid per-frame filesystem open/write/close.
  csv_flush_interval_frames: 100
  rate_diagnostics: true
